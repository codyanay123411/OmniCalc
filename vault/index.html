<!DOCTYPE html>
<html lang="en">
<head>

<title>Vault</title>
<style>
:root{--bg:#0e1014;--panel:#161a21;--panel2:#1c212a;--panel3:#262c37;--line:#2a313d;--text:#e8ecf2;--muted:#9aa4b2;--faint:#5d6776;--accent:#5b9dff;--accent-soft:rgba(91,157,255,.14);--good:#3ecf8e;--bad:#ff6b6b;--warn:#f5b041;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:14px}
html.light{--bg:#eef0f4;--panel:#fff;--panel2:#f5f6f9;--panel3:#e7eaf0;--line:#dde1e8;--text:#14171c;--muted:#5c6573;--faint:#9aa1ad;--accent-soft:rgba(91,157,255,.13)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hidden{display:none !important}
.muted{color:var(--muted)}.small{font-size:12.5px}.mono{font-family:var(--mono)}
.in{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--accent)}
textarea.in{resize:vertical;min-height:90px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:inline-grid;place-items:center;flex:none;color:var(--muted)}
.ib:hover{color:var(--text)}
.ib svg,.nav svg,.tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px}
.err{color:var(--bad);font-size:13px;min-height:18px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px}

/* ---- full-screen gates (setup / unlock) ---- */
.gate{min-height:100%;display:grid;place-items:center;padding:20px}
.gate .card{width:min(440px,100%)}
.logo{width:54px;height:54px;border-radius:16px;background:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.logo svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.choice{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.choice .btn{justify-content:flex-start;text-align:left;padding:14px;flex-direction:column;align-items:flex-start;white-space:normal}
.choice .btn b{font-size:15px}.choice .btn span{color:var(--muted);font-size:13px;font-weight:400}
.meter{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;transition:width .2s}

/* ---- app shell ---- */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.nav{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:2px 8px 14px}
.brand .lg{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}.brand .lg svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--faint)}
.nav .grp{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);padding:12px 10px 4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .search{flex:1;max-width:520px}
.syncdot{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.syncdot i{width:8px;height:8px;border-radius:50%;background:var(--faint)}.syncdot.ok i{background:var(--good)}.syncdot.busy i{background:var(--warn)}.syncdot.bad i{background:var(--bad)}
.body{flex:1;min-height:0;display:flex}
.list{width:360px;flex:none;border-right:1px solid var(--line);overflow-y:auto}
.detail{flex:1;min-width:0;overflow-y:auto;padding:20px}
.page{flex:1;overflow-y:auto;padding:20px}
.page .card{max-width:760px;margin-bottom:14px}
.it{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.it:hover{background:var(--panel2)}.it.on{background:var(--accent-soft)}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px}
.it .t{min-width:0;flex:1}.it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.it .t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:var(--warn)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.fld{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px}
.fld .r{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}.fld .r:first-child{border-top:0}
.fld .k{font-size:12px;color:var(--muted);margin-bottom:2px}.fld .v{font-family:var(--mono);word-break:break-all;font-size:15px}
.fld .r>div:first-child{flex:1;min-width:0}
.code{font-family:var(--mono);font-size:30px;letter-spacing:3px;font-weight:600}
.ring{width:30px;height:30px;flex:none}
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:16px}.dhead .av{width:52px;height:52px;font-size:22px;border-radius:14px}
.dhead h1{margin:0;word-break:break-word}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--panel3);color:var(--muted)}
.tag.bad{background:rgba(255,107,107,.15);color:var(--bad)}.tag.warn{background:rgba(245,176,65,.15);color:var(--warn)}.tag.good{background:rgba(62,207,142,.15);color:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel3);color:var(--text);padding:10px 16px;border-radius:12px;z-index:90;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:grid;place-items:center;padding:16px}
.modal .card{width:min(560px,100%);max-height:92dvh;overflow-y:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.pwrow{display:flex;gap:6px}.pwrow .in{flex:1;font-family:var(--mono)}
.gen{font-family:var(--mono);font-size:20px;word-break:break-all;padding:14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin:10px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:13px;color:var(--muted)}.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tb{display:none}
.back{display:none}
table.prev{width:100%;border-collapse:collapse;font-size:13px}table.prev td,table.prev th{text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.steps{line-height:1.7;padding-left:20px;margin:6px 0}
video.scan{width:100%;border-radius:12px;background:#000}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:760px;margin-bottom:14px}
.stat{padding:14px}.stat b{display:block;font-size:26px}
/* ---- phone ---- */
@media (max-width:760px){
  .nav{display:none}
  .top{padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
  .top .label{display:none}
  .list{width:100%;border-right:0;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .detail{position:fixed;inset:0;z-index:30;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom))}
  .detail.empty-d{display:none}
  .back{display:inline-grid}
  .page{padding:14px 12px calc(90px + env(safe-area-inset-bottom))}
  .tb{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tb button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11px;padding:6px 0;border-radius:12px;cursor:pointer}
  .tb button.on{color:var(--accent);background:var(--accent-soft)}
  .tb svg{width:22px;height:22px}
  .grid2{grid-template-columns:1fr}
  input,select,textarea{font-size:16px !important}
  .modal{align-items:end;padding:0}
  .modal .card{border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  html.typing .tb{display:none}
}
</style>

<body>
<div id="root"></div>
<script>
// =====================================================================
// Vault core: crypto, TOTP, CSV import, merge, generator. No DOM.
// =====================================================================
const enc = new TextEncoder(), dec = new TextDecoder();
const SUB = crypto.subtle;
const KDF_ITER = 600000; // PBKDF2-SHA256, OWASP-recommended minimum

// ---------- byte helpers ----------
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
const b64 = (u8) => { let s = ""; const a = new Uint8Array(u8); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64url = (u8) => b64(u8).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64url = (s) => unb64(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
const uid = () => b64url(rand(12));

// ---------- keys ----------
async function deriveKEK(password, salt, iter = KDF_ITER) {
  const base = await SUB.importKey("raw", enc.encode(password.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
  return SUB.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function hkdfKey(secret, info) {
  const base = await SUB.importKey("raw", secret, "HKDF", false, ["deriveKey"]);
  return SUB.deriveKey({ name: "HKDF", hash: "SHA-256", salt: new Uint8Array(32), info: enc.encode(info) }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
const importVK = (raw) => SUB.importKey("raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
async function seal(key, bytes, aad = "vault") {
  const iv = rand(12);
  const ct = await SUB.encrypt({ name: "AES-GCM", iv, additionalData: enc.encode(aad) }, key, bytes);
  return { iv: b64(iv), ct: b64(new Uint8Array(ct)) };
}
async function open_(key, box, aad = "vault") {
  const pt = await SUB.decrypt({ name: "AES-GCM", iv: unb64(box.iv), additionalData: enc.encode(aad) }, key, unb64(box.ct));
  return new Uint8Array(pt);
}

// ---------- vault file ----------
// { v:1, kdf:{iter,salt}, wpw:{iv,ct}, pk:[{id,salt,iv,ct,label,added}], data:{iv,ct}, rev, updated }
// The vault key (VK) is random and never changes; the master password / passkeys only wrap it.
async function createVault(password) {
  const vkRaw = rand(32), salt = rand(16);
  const kek = await deriveKEK(password, salt);
  const file = { v: 1, kdf: { alg: "PBKDF2-SHA256", iter: KDF_ITER, salt: b64(salt) }, wpw: await seal(kek, vkRaw, "vk"), pk: [], data: null, rev: 0, updated: Date.now() };
  const vk = await importVK(vkRaw);
  const state = { items: [], tomb: {}, settings: {} };
  file.data = await seal(vk, enc.encode(JSON.stringify(state)));
  return { file, vk, vkRaw, state };
}
async function unlockWithPassword(file, password) {
  const kek = await deriveKEK(password, unb64(file.kdf.salt), file.kdf.iter);
  let vkRaw;
  try { vkRaw = await open_(kek, file.wpw, "vk"); } catch (e) { throw new Error("Wrong master password"); }
  return finishUnlock(file, vkRaw);
}
async function finishUnlock(file, vkRaw) {
  const vk = await importVK(vkRaw);
  const state = JSON.parse(dec.decode(await open_(vk, file.data)));
  state.items = state.items || []; state.tomb = state.tomb || {}; state.settings = state.settings || {};
  return { vk, vkRaw, state };
}
async function sealState(file, vk, state) {
  return Object.assign({}, file, { data: await seal(vk, enc.encode(JSON.stringify(state))), updated: Date.now() });
}
async function changePassword(file, vkRaw, newPassword) {
  const salt = rand(16), kek = await deriveKEK(newPassword, salt);
  return Object.assign({}, file, { kdf: { alg: "PBKDF2-SHA256", iter: KDF_ITER, salt: b64(salt) }, wpw: await seal(kek, vkRaw, "vk"), updated: Date.now() });
}

// ---------- passkey unlock (WebAuthn PRF) ----------
const passkeysPossible = () => !!(window.isSecureContext && window.PublicKeyCredential && navigator.credentials && location.protocol === "https:" || location.hostname === "localhost");
async function addPasskey(file, vkRaw, label) {
  const salt = rand(32);
  const cred = await navigator.credentials.create({ publicKey: {
    rp: { name: "Vault", id: location.hostname },
    user: { id: rand(16), name: "vault@" + location.hostname, displayName: "Vault" },
    challenge: rand(32),
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { residentKey: "preferred", userVerification: "required" },
    extensions: { prf: { eval: { first: salt } } },
  } });
  const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
  if (!ext.prf || ext.prf.enabled === false) throw new Error("This device's passkeys can't unlock a vault (no PRF support). Use your master password here.");
  let out = ext.prf.results && ext.prf.results.first;
  const id = new Uint8Array(cred.rawId);
  if (!out) out = await prfEval([{ id: b64url(id), salt: b64(salt) }]).then((r) => r.out); // some authenticators only answer on sign-in
  const wrap = await hkdfKey(new Uint8Array(out), "vault-passkey-wrap");
  const entry = Object.assign({ id: b64url(id), salt: b64(salt), label: label || "Passkey", added: Date.now() }, await seal(wrap, vkRaw, "vk"));
  return Object.assign({}, file, { pk: [...(file.pk || []), entry], updated: Date.now() });
}
async function prfEval(list) {
  const evalBy = {}; list.forEach((p) => (evalBy[p.id] = { first: unb64(p.salt) }));
  const a = await navigator.credentials.get({ publicKey: {
    challenge: rand(32), userVerification: "required", rpId: location.hostname,
    allowCredentials: list.map((p) => ({ type: "public-key", id: unb64url(p.id) })),
    extensions: { prf: { evalByCredential: evalBy } },
  } });
  const r = a.getClientExtensionResults().prf;
  if (!r || !r.results || !r.results.first) throw new Error("That passkey didn't return an unlock key. Use your master password.");
  return { id: b64url(new Uint8Array(a.rawId)), out: r.results.first };
}
async function unlockWithPasskey(file) {
  if (!file.pk || !file.pk.length) throw new Error("No passkey set up yet");
  const { id, out } = await prfEval(file.pk);
  const p = file.pk.find((x) => x.id === id); if (!p) throw new Error("Unknown passkey");
  const wrap = await hkdfKey(new Uint8Array(out), "vault-passkey-wrap");
  let vkRaw; try { vkRaw = await open_(wrap, p, "vk"); } catch (e) { throw new Error("That passkey doesn't match this vault"); }
  return finishUnlock(file, vkRaw);
}

// ---------- TOTP (RFC 6238) ----------
function base32(s) {
  s = String(s).toUpperCase().replace(/[\s=-]/g, "");
  const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"; let bits = 0, val = 0; const out = [];
  for (const ch of s) { const i = A.indexOf(ch); if (i < 0) throw new Error("Not a valid 2FA secret key"); val = (val << 5) | i; bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
  if (!out.length) throw new Error("Empty 2FA secret");
  return new Uint8Array(out);
}
function parseOtp(input) {
  // accepts an otpauth:// link or a bare base32 secret
  input = String(input || "").trim(); if (!input) return null;
  if (/^otpauth:\/\//i.test(input)) {
    const u = new URL(input); if (u.host.toLowerCase() !== "totp") throw new Error("Only time-based (TOTP) codes are supported");
    const q = u.searchParams, label = decodeURIComponent(u.pathname.slice(1));
    const [iss, acct] = label.includes(":") ? label.split(/:(.*)/s) : [q.get("issuer") || "", label];
    const o = { secret: q.get("secret"), digits: +(q.get("digits") || 6), period: +(q.get("period") || 30), algo: (q.get("algorithm") || "SHA1").toUpperCase().replace("SHA", "SHA-"), issuer: q.get("issuer") || iss, account: acct };
    base32(o.secret); return o;
  }
  base32(input); return { secret: input.replace(/\s/g, "").toUpperCase(), digits: 6, period: 30, algo: "SHA-1" };
}
async function totp(otp, t = Date.now()) {
  const o = typeof otp === "string" ? parseOtp(otp) : otp;
  const key = await SUB.importKey("raw", base32(o.secret), { name: "HMAC", hash: o.algo || "SHA-1" }, false, ["sign"]);
  const ctr = Math.floor(t / 1000 / (o.period || 30)), msg = new Uint8Array(8);
  let c = ctr; for (let i = 7; i >= 0; i--) { msg[i] = c & 255; c = Math.floor(c / 256); }
  const h = new Uint8Array(await SUB.sign("HMAC", key, msg)), off = h[h.length - 1] & 15;
  const bin = ((h[off] & 127) << 24) | (h[off + 1] << 16) | (h[off + 2] << 8) | h[off + 3];
  return String(bin % 10 ** (o.digits || 6)).padStart(o.digits || 6, "0");
}

// ---------- CSV ----------
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim() !== ""));
}
const csvCell = (v) => { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
// header aliases: NordPass first, then Chrome / Bitwarden / 1Password / LastPass / generic
const ALIAS = {
  name: ["name", "title", "account", "item name"], url: ["url", "website", "website url", "login_uri", "login uri", "urls", "web site"],
  username: ["username", "user name", "login", "login_username", "email", "user"], password: ["password", "login_password", "pass"],
  note: ["note", "notes", "comment", "comments", "extra"], folder: ["folder", "group", "grouping", "collection", "category"],
  totp: ["totp", "login_totp", "otp", "one-time password", "otpauth", "2fa", "authenticator"],
  cardholder: ["cardholdername", "cardholder name", "card holder", "name on card"], cardnumber: ["cardnumber", "card number", "number"],
  cvc: ["cvc", "cvv", "security code"], expiry: ["expirydate", "expiry date", "expiration", "expiration date", "expires"], zip: ["zipcode", "zip", "postal code"],
};

      prefs.lastSync = Date.now(); savePrefs(); syncState = "ok"; syncErr = "";
      if (view !== "settings") { renderNav(); if (!$(".modal")) { const keep = sel; renderBody(); sel = keep; } }
      if (loud) toast("Synced");
    } catch (e) { syncState = "error"; syncErr = e.message; if (loud) toast(e.message); }
    paintSync(); syncing = null;
  })();
  return syncing;
}

// ---------- self-test ----------
async function selfTest() {
  const log = []; let pass = 0, fail = 0;
  const ok = (name, cond) => { if (cond) { pass++; log.push("✓ " + name); } else { fail++; log.push("✗ " + name); } };
  try {
    // RFC 6238 test vectors (SHA-1, 8 digits)
    const sec = "GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ"; // "12345678901234567890"
    ok("TOTP RFC 6238 @59s", (await totp({ secret: sec, digits: 8, period: 30, algo: "SHA-1" }, 59000)) === "94287082");
    ok("TOTP RFC 6238 @1111111109s", (await totp({ secret: sec, digits: 8, period: 30, algo: "SHA-1" }, 1111111109000)) === "07081804");
    ok("TOTP RFC 6238 @2000000000s", (await totp({ secret: sec, digits: 8, period: 30, algo: "SHA-1" }, 2000000000000)) === "69279037");
    const sec256 = "GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQGEZA"; // 32-byte seed
    ok("TOTP SHA-256 vector", (await totp({ secret: sec256, digits: 8, period: 30, algo: "SHA-256" }, 59000)) === "46119246");
    const o = parseOtp("otpauth://totp/Discord:cody%40mail.com?secret=JBSWY3DPEHPK3PXP&issuer=Discord");
    ok("otpauth link parsed", o.issuer === "Discord" && o.account === "cody@mail.com" && o.digits === 6);
    let bad = false; try { parseOtp("not a key!!"); } catch (e) { bad = true; } ok("bad 2FA key rejected", bad);
    // crypto round trip with a fast KDF so the test is quick
    const v = await createVault("correct horse battery staple");
    const st2 = { items: [{ id: "a", name: "Test", password: "p@ss" }], tomb: {}, settings: {} };
    const f2 = await sealState(v.file, v.vk, st2);
    const u = await unlockWithPassword(f2, "correct horse battery staple");
    ok("encrypt → decrypt round trip", u.state.items[0].password === "p@ss");
    let wrong = false; try { await unlockWithPassword(f2, "wrong password"); } catch (e) { wrong = /Wrong/.test(e.message); } ok("wrong master password rejected", wrong);
    const tampered = JSON.parse(JSON.stringify(f2)); const ct = unb64(tampered.data.ct); ct[5] ^= 1; tampered.data.ct = b64(ct);
    let tam = false; try { await unlockWithPassword(tampered, "correct horse battery staple"); } catch (e) { tam = true; } ok("tampered vault detected", tam);
    const f3 = await changePassword(f2, v.vkRaw, "a brand new long password");
    ok("password change keeps data", (await unlockWithPassword(f3, "a brand new long password")).state.items[0].name === "Test");
    ok("no plaintext in vault file", !JSON.stringify(f2).includes("p@ss") && !JSON.stringify(f2).includes("Test"));
    // NordPass CSV, including a folder-name row, quotes, a multi-line note and a card
    const csv = 'name,url,username,password,note,cardholdername,cardnumber,cvc,expirydate,zipcode,folder,full_name,phone_number,email,address1,address2,city,country,state\r\nGames,,,,,,,,,,,,,,,,,,\r\nDiscord,https://discord.com,cody@mail.com,"pa,ss""word",,,,,,,Games,,,,,,,,\r\nBank card,,,,"line1\nline2",CODY A,4111 1111 1111 1111,123,12/29,84101,,,,,,,,,\r\nWifi,,,,router is behind TV,,,,,,Home,,,,,,,,\r\n';
    const im = importCSV(csv);
    ok("NordPass CSV: 3 items, folder row skipped", im.items.length === 3 && im.skipped.length === 1);
    const dc = im.items.find((i) => i.name === "Discord");
    ok("NordPass CSV: quotes & commas in password", dc && dc.password === 'pa,ss"word' && dc.folder === "Games" && dc.username === "cody@mail.com");
    const cd = im.items.find((i) => i.type === "card");
    ok("NordPass CSV: card fields", cd && cd.number === "4111 1111 1111 1111" && cd.cvc === "123" && cd.notes === "line1\nline2");
    ok("NordPass CSV: secure note", im.items.some((i) => i.type === "note" && i.name === "Wifi"));
    const chrome = importCSV("name,url,username,password,note\ngithub.com,https://github.com/login,cody,hunter2,\n");
    ok("Chrome CSV import", chrome.items.length === 1 && chrome.items[0].password === "hunter2");
    ok("CSV export round trip", importCSV(exportCSV(im.items)).items.length === 3);
    // merge
    const A = { items: [{ id: "1", name: "old", updated: 1 }, { id: "2", name: "keep", updated: 5 }], tomb: {} }, B = { items: [{ id: "1", name: "new", updated: 2 }, { id: "3", name: "added", updated: 3 }], tomb: { 2: 9 } };
    const M = mergeStates(A, B);
    ok("sync merge: newest edit wins, adds & deletes carry over", M.items.length === 2 && M.items.find((i) => i.id === "1").name === "new" && !M.items.find((i) => i.id === "2"));
    ok("sync merge is symmetric", JSON.stringify(mergeStates(B, A).items.map((i) => i.id).sort()) === JSON.stringify(M.items.map((i) => i.id).sort()));
    // generator & strength
    const g = genPassword({ length: 24 });
    ok("generator: length & every character type", g.length === 24 && /[a-z]/.test(g) && /[A-Z]/.test(g) && /\d/.test(g) && /[^a-zA-Z0-9]/.test(g));
    ok("generator: no repeats across 200 runs", new Set(Array.from({ length: 200 }, () => genPassword({ length: 16 }))).size === 200);
    ok("passphrase has 5 words", genPassphrase(5).split("-").length === 5);
    ok("strength: weak vs strong", strength("password123").score <= 1 && strength(g).score >= 3);
    ok("breach check uses k-anonymity (5-char prefix only)", await (async () => { let sent = ""; const n = await breachCount("password", async (url) => { sent = url; return { text: async () => "1E4C9B93F3F0682250B6CF8331B7EE68FD8:9659365\r\n" }; }); return sent.endsWith("/5BAA6") && n === 9659365; })());
    // sync transport against a fake GitHub
    const store = {}; let shaN = 0;
    const fake = async (url, opt = {}) => { const key = url.split("?")[0]; if (!opt.method) { if (!store[key]) return { status: 404, ok: false }; return { status: 200, ok: true, json: async () => ({ content: store[key].c, sha: store[key].sha }) }; } const b = JSON.parse(opt.body); if (store[key] && b.sha !== store[key].sha) return { status: 409, ok: false }; store[key] = { c: b.content, sha: "s" + ++shaN }; return { status: 200, ok: true, json: async () => ({ content: { sha: store[key].sha } }) }; };
    const gh = ghSync({ owner: "me", repo: "vault-data", token: "x" }, fake);
    ok("sync: empty repo reads as no file", (await gh.get()).file === null);
    const p1 = await gh.put(f2, null); const back = await gh.get();
    ok("sync: upload then download", back.sha === p1.sha && back.file.data.ct === f2.data.ct);
    ok("sync: stale write is refused (no overwrite)", (await gh.put(f2, "stale")).conflict === true);
  } catch (e) { fail++; log.push("✗ crashed: " + e.message); }
  return { pass, fail, log };
}
